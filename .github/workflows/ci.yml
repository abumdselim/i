name: CI

# The gate is the judge, so CI runs exactly what a session runs: build, parity,
# lint, types — then the visual diff and the device delta against the frozen
# reference. Nothing here deploys; the artefact is next-app/out.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build · gate · lint · types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python deps for the gate
        run: python -m pip install --quiet lxml

      - run: npm ci
      - run: npm run verify
      - run: npm run --silent typecheck

  visual:
    name: visual diff · device delta
    runs-on: ubuntu-latest
    needs: verify
    defaults:
      run:
        working-directory: next-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: python -m pip install --quiet lxml pillow
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      # The baseline is the frozen reference, not the working tree: it is what the
      # gate and the screenshots were taken against. Its pages reference
      # ../assets by relative path, so the repository's assets come along.
      - name: Visual diff and device delta
        run: |
          mkdir -p ../.ci-legacy
          cp qa/reference/*.html ../.ci-legacy/
          cp -r ../assets ../.ci-legacy/assets
          (cd ../.ci-legacy && python -m http.server 8081 --bind 127.0.0.1 > /dev/null 2>&1 &)
          node scripts/serve.mjs > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null && curl -fsS http://127.0.0.1:8081/index.html > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run qa:capture
          npm run qa:compare
          npm run qa:device:diff

      - name: Keep the heatmaps if the diff fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: next-app/qa/diff
          retention-days: 7
