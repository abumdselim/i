<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QA harness</title>
<style>
  html,body{margin:0;background:#2a2f38;overflow-x:hidden}
  .stage{transform-origin:top left;position:relative}
  iframe{border:0;display:block;background:#fff}
  .label{position:fixed;left:8px;bottom:8px;z-index:5;font:11px/1.4 monospace;color:#fff;background:#000a;padding:4px 6px}
</style>
</head>
<body>
<div class="stage" id="stage"><iframe id="f"></iframe></div>
<div class="label" id="label"></div>
<script>
  var p = new URLSearchParams(location.search);
  var page = p.get('p') || 'index.html';
  var w = parseInt(p.get('w') || '1440', 10);
  var h = parseInt(p.get('h') || '3600', 10);
  var y = parseInt(p.get('y') || '0', 10);
  var scale = parseFloat(p.get('s') || '0') || Math.min(window.innerWidth / w, 1);
  var f = document.getElementById('f');
  f.src = page;
  f.width = w; f.height = h;
  f.style.width = w + 'px'; f.style.height = h + 'px';
  var stage = document.getElementById('stage');
  stage.style.transform = 'scale(' + scale + ') translateY(-' + y + 'px)';
  document.getElementById('label').textContent = page + ' · ' + w + 'px · s' + scale.toFixed(3) + ' · y' + y;
</script>
</body>
</html>
